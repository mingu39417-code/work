<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>수신거부</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%233b5bdb%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="wrap">
  <div class="card stack" id="box">
    <h1>광고 메일 수신거부</h1>
    <p>아래 버튼을 누르면 이 주소로 더 이상 제안 · 광고 메일을 보내지 않습니다. 진행 중인 작업에 관한 안내 메일은 계속 받으실 수 있습니다.</p>
    <div><button class="btn primary" id="go">수신거부하기</button></div>
    <p class="error-text" id="err" role="alert"></p>
  </div>
</main>
<script src="/assets/common.js"></script>
<script>
  $('#go').onclick = async () => {
    try {
      await api('/api/public/unsubscribe', { method: 'POST', body: { token: location.pathname.split('/').pop() } });
      $('#box').innerHTML = '<h1>수신거부되었습니다</h1><p>앞으로 광고 메일을 보내지 않습니다. 불편을 드려 죄송합니다.</p>';
    } catch (err) { $('#err').textContent = err.message; }
  };
</script>
</body>
</html>
